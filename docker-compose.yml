services:
  backend:
    build:
      context: ./backend
    image: gradium-backend
    container_name: gradium-backend
    restart: unless-stopped
    environment:
      # SQLite database file lives on the persisted /data volume
      DATABASE_URL: sqlite:////data/gradium.db
      SECRET_KEY: ${SECRET_KEY:-change-this-secret-key-in-production}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      UPLOAD_DIR: /data/uploads
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    volumes:
      - backend_data:/data
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  frontend:
    build:
      context: ./frontend
      args:
        # NEXT_PUBLIC_* are inlined into the browser bundle at build time
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
    image: gradium-frontend
    container_name: gradium-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend_data:
