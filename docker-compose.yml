services:
  backend:
    build:
      context: ./backend
    image: gradium-blue-v5-backend
    container_name: gradium-blue-v5-backend
    restart: unless-stopped
    # Hardening: a public deploy was compromised via RCE (miner dropped in the
    # container). These limit blast radius and protect host/VPN resources.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 300
    mem_limit: 900m
    cpus: 1.0
    environment:
      DATABASE_URL: sqlite:////data/gradium.db
      SECRET_KEY: ${SECRET_KEY:-change-this-secret-key-in-production}
      # Security posture: "production" hides /docs and refuses to boot on the
      # default SECRET_KEY. The backend is now internal-only (reached solely via
      # the caddy proxy), so TRUST_PROXY is on and the rate limiter keys on the
      # real client IP forwarded by caddy (X-Forwarded-For).
      ENVIRONMENT: ${ENVIRONMENT:-production}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      AI_PROVIDER: ${AI_PROVIDER:-gigachat}
      # GigaChat (Sber) — default provider in v5
      GIGACHAT_AUTH_KEY: ${GIGACHAT_AUTH_KEY:-}
      GIGACHAT_SCOPE: ${GIGACHAT_SCOPE:-GIGACHAT_API_PERS}
      GIGACHAT_MODEL: ${GIGACHAT_MODEL:-GigaChat-2-Max}
      GIGACHAT_MAX_TOKENS: ${GIGACHAT_MAX_TOKENS:-4096}
      GIGACHAT_VERIFY_SSL: ${GIGACHAT_VERIFY_SSL:-false}
      # Other providers (set AI_PROVIDER to switch)
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      UPLOAD_DIR: /data/uploads
      # Same-origin through the proxy means CORS is not exercised by the browser;
      # kept for any direct/cross-origin API callers.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      # Subscription generation quota (resets each GENERATION_PERIOD)
      GENERATION_PERIOD: ${GENERATION_PERIOD:-monthly}
      FREE_GENERATIONS: ${FREE_GENERATIONS:-3}
      PRO_GENERATIONS: ${PRO_GENERATIONS:-30}
      MAX_GENERATIONS: ${MAX_GENERATIONS:-60}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-muhammadjonaslonov4@gmail.com}
    volumes:
      - blue_v5_data:/data
    # No published port: the backend is reached only via the caddy proxy on the
    # internal network. Set BACKEND_PORT and add a ports entry to expose directly.

  frontend:
    build:
      context: .
      args:
        # Empty => same-origin: the browser calls the page's own origin and the
        # proxy routes /api + /ws to the backend (no port, no CORS). Override for
        # split-origin builds.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
    image: gradium-blue-v5-frontend
    container_name: gradium-blue-v5-frontend
    restart: unless-stopped
    # Hardening: read-only rootfs + noexec tmpfs stops a dropped payload (e.g.
    # the "./.x" miner seen in the wild) from being written and executed.
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
      - /app/.next/cache:noexec,nosuid,size=128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 200
    mem_limit: 400m
    cpus: 0.75
    # No published port: the frontend is served through the caddy proxy only.
    depends_on:
      backend:
        condition: service_healthy

  # Single ingress: serves the whole app on port 80 (http://<host> with no port)
  # and routes /api + /ws to the backend so login and live quizzes are same-origin.
  caddy:
    image: caddy:2-alpine
    container_name: gradium-blue-v5-caddy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

volumes:
  blue_v5_data:
  caddy_data:
  caddy_config:
